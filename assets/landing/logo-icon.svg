<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Orbit -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#dbe4ff" stroke-width="2" stroke-dasharray="4 4" />
  <!-- Inner Orbit -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#ffc800" stroke-width="2" opacity="0.5" />
  
  <!-- Core -->
  <circle cx="50" cy="50" r="14" fill="url(#coreGrad)" />
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
  
  <!-- Subjects on orbits -->
  <!-- Math -->
  <g transform="translate(10, 50)">
    <circle cx="0" cy="0" r="9" fill="#ffffff" />
    <circle cx="0" cy="0" r="9" fill="none" stroke="#ffc800" stroke-width="2" />
    <text x="0" y="3.5" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="10" fill="#ffc800" text-anchor="middle"></text>
  </g>
  <!-- Science -->
  <g transform="translate(78, 22)">
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#1cb0f6" stroke-width="2" />
    <circle cx="0" cy="0" r="2.5" fill="#ff6b6b" />
  </g>
  <!-- Language / Book -->
  <g transform="translate(65, 87)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#58cc02" stroke-width="2" />
    <rect x="-3" y="-3.5" width="6" height="7" fill="#58cc02" rx="1" />
  </g>
</svg>