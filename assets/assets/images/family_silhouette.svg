<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56" role="img" aria-labelledby="title">
  <title>Family - walking together silhouette</title>
  <g fill="currentColor">
    <!-- Father (left) -->
    <circle cx="14" cy="20" r="5.5"/>
    <rect x="9" y="26" width="10" height="18" rx="2.5" ry="2.5"/>
    <ellipse cx="22" cy="31" rx="7" ry="2.5" transform="rotate(-12 22 31)"/>
    <!-- Boy (center-left) -->
    <circle cx="38" cy="24" r="4.5"/>
    <rect x="34" y="29" width="8" height="14" rx="2" ry="2"/>
    <ellipse cx="30" cy="33" rx="5" ry="1.8" transform="rotate(-18 30 33)"/>
    <ellipse cx="46" cy="33" rx="5" ry="1.8" transform="rotate(18 46 33)"/>
    <!-- Mother (center) -->
    <circle cx="58" cy="22" r="5"/>
    <rect x="53" y="28" width="10" height="16" rx="2" ry="2"/>
    <ellipse cx="48" cy="31" rx="5" ry="1.8" transform="rotate(-14 48 31)"/>
    <ellipse cx="68" cy="31" rx="5.5" ry="1.8" transform="rotate(14 68 31)"/>
    <!-- Girl (right) -->
    <circle cx="82" cy="26" r="4"/>
    <rect x="79" y="31" width="6" height="13" rx="1.5" ry="1.5"/>
    <ellipse cx="74" cy="34" rx="4" ry="1.5" transform="rotate(-8 74 34)"/>
  </g>
</svg>
