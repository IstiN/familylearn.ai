<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 130 130" width="100%" height="100%">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </radialGradient>
  </defs>

  <!-- Outer dashed orbit ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#dbe4ff"
    stroke-width="2" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Inner orbit ring -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#ffc800"
    stroke-width="2" opacity="0.8"/>

  <!-- Subject 1 — Math Σ -->
  <g transform="translate(10,50)">
    <circle r="13" fill="white" stroke="#ffc800" stroke-width="2.5"/>
    <path d="M-5,6 L-5,-6 L5,-6 M-5,0 L3,0 M-5,6 L5,6"
      stroke="#ffc800" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Subject 2 — AI -->
  <g transform="translate(80,26)">
    <circle r="11" fill="white" stroke="#1cb0f6" stroke-width="2.5"/>
    <circle r="3.5" fill="#ff6b6b"/>
  </g>

  <!-- Subject 3 — Book -->
  <g transform="translate(68,86)">
    <circle r="12" fill="white" stroke="#58cc02" stroke-width="2.5"/>
    <rect x="-4.5" y="-5" width="9" height="10" rx="1.5" fill="#58cc02"/>
  </g>

  <!-- Subject 4 — Edit -->
  <g transform="translate(50,8)">
    <circle r="10" fill="white" stroke="#8b5fd6" stroke-width="2.5"/>
    <line x1="-3" y1="3" x2="3" y2="-3" stroke="#8b5fd6" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="-3" y2="-3" stroke="#8b5fd6" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Core sphere -->
  <circle cx="50" cy="50" r="14" fill="url(#coreGrad)"/>
  <circle cx="50" cy="50" r="5" fill="white"/>
</svg>
