<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="title">
  <title>Summary icon - outline</title>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer ring -->
    <circle cx="12" cy="12" r="9" stroke-opacity="0.3"/>
    <!-- Middle ring -->
    <circle cx="12" cy="12" r="6.5" stroke-opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="12" cy="12" r="4" stroke-opacity="0.7"/>
    <!-- Center dot -->
    <circle cx="12" cy="12" r="1.5"/>
  </g>
</svg>
