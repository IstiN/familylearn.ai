  <style>
    :root { color-scheme: dark light; --bg: #0f0a14; --fg: #f3f0fa; --muted: #a89fc0; --accent: #8b5fd6; --card: #1a1224; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; }
    main { max-width: 42rem; margin: 0 auto; padding: 1.5rem; }
    header.site { padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    header.site a { color: var(--accent); text-decoration: none; font-weight: 600; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; line-height: 1.2; }
    .lead { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.95rem; }
    .outline-heading { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; font-weight: 600; color: var(--fg); }
    .topics { padding: 0 0 0 1.25rem; margin: 0; }
    .topics li { padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .topics li:last-child { border-bottom: none; }
    .topic-title { font-weight: 600; }
    .topic-desc { font-size: 0.875rem; color: var(--muted); margin-top: 0.2rem; }
    .cta-wrap { margin-top: 2rem; }
    .cta { display: inline-block; background: #58cc02; color: #0f0a14; font-weight: 700; padding: 0.65rem 1.25rem; border-radius: 0.5rem; text-decoration: none; }
    .cta:hover { filter: brightness(1.08); }
    .seo-index { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
    .seo-index h2 { font-size: 1rem; color: var(--muted); margin: 0 0 1rem; font-weight: 600; }
    .seo-lesson { margin-bottom: 1.5rem; }
    .seo-lesson h3 { font-size: 0.95rem; margin: 0 0 0.5rem; }
    .seo-md { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.75rem; line-height: 1.4; color: var(--muted); }
  </style>
</head>
<body>

__TOPIC_ROWS__

        </div>
        <section class="seo-index">

__FULL_TEXT_BLOCK__
